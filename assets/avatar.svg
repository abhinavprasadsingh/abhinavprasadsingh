      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>


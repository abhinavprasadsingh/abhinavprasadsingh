<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Project 2: PhishShield">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#030712"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55E6FF" stop-opacity="0"/><stop offset="0.5" stop-color="#55E6FF" stop-opacity="0.12"/><stop offset="1" stop-color="#55E6FF" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="1200" height="190" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="190" fill="url(#bg)"/>
<rect y="0" width="260" height="190" fill="url(#beam)"><animate attributeName="x" from="-260" to="1200" dur="9s" repeatCount="indefinite"/></rect>
</g>
<rect x="1.5" y="1.5" width="1197" height="187" rx="13" fill="none" stroke="#55E6FF" stroke-opacity="0.22"/>
<rect x="1.5" y="1.5" width="1197" height="187" rx="13" fill="none" stroke="#00D9FF" stroke-width="2.5" stroke-dasharray="140 2630" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-2770" dur="7s" repeatCount="indefinite"/></rect>
<text x="40" y="112" font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="64" font-weight="700" fill="none" stroke="#55E6FF" stroke-opacity="0.55" stroke-width="1.5">02</text>
<rect x="138" y="30" width="1.5" height="130" fill="#55E6FF" fill-opacity="0.35"/>
<text x="164" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#EAFBFF">PhishShield</text>
<text x="164" y="96" font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" fill="#91A8B8">A URL analysis project exploring suspicious link patterns and explainable</text>
<text x="164" y="120" font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" fill="#91A8B8">heuristic checks, with an optional machine-learning training and evaluation workflow.</text>
<rect x="164" y="138" width="77.6" height="28" rx="6" fill="#030712" stroke="#55E6FF" stroke-opacity="0.5"/>
<text x="202.8" y="157" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#55E6FF" textLength="51.6" lengthAdjust="spacing">PYTHON</text>
<rect x="251.6" y="138" width="129.2" height="28" rx="6" fill="#030712" stroke="#55E6FF" stroke-opacity="0.5"/>
<text x="316.2" y="157" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#55E6FF" textLength="103.2" lengthAdjust="spacing">SCIKIT-LEARN</text>
</svg>
